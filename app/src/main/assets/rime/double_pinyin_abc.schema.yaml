# Rime schema - 雾凇拼音 · 智能ABC双拼 (iDvel/rime-ice)
# encoding: utf-8

schema:
  schema_id: double_pinyin_abc
  name: 智能ABC双拼
  version: "2026-06-30"
  author:
    - Dvel
  description: |
    雾凇拼音 - 智能ABC双拼
    https://github.com/iDvel/rime-ice

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, Ａ ]
  - name: ascii_punct
    reset: 0
    states: [ ¥, $ ]
  - name: traditionalization
    reset: 0
    states: [ 简, 繁 ]

engine:
  processors:
    - predictor
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - predict_translator
    - punct_translator
    - script_translator
    - table_translator@melt_eng
    - table_translator@cn_en
  filters:
    - uniquifier

predictor:
  db: predict.db
  max_candidates: 8
  max_iterations: 1

translator:
  dictionary: rime_ice
  prism: double_pinyin_abc
  enable_user_dict: true
  enable_word_completion: true
  enable_completion: true
  enable_sentence: true
  max_sentences: 1
  initial_quality: 1.2
  preedit_format:
    - xform/o(\w)/0$1/
    - xform/(\w)q/$1ei/
    - xform/(\w)n/$1un/
    - xform/(\w)g/$1eng/
    - xform/(\w)w/$1ian/
    - xform/([dtnljqx])r/$1iu/
    - xform/0r/0er/
    - xform/([nljqxb])t/$1iang/
    - xform/(\w)t/$1uang/
    - xform/(\w)y/$1ing/
    - xform/([dtnlgkhaevrzcs])o/$1uo/
    - xform/(\w)p/$1uan/
    - xform/([jqx])s/$1iong/
    - xform/(\w)s/$1ong/
    - xform/([gkhaevrzcs])d/$1ua/
    - xform/(\w)d/$1ia/
    - xform/(\w)f/$1en/
    - xform/(\w)h/$1ang/
    - xform/(\w)j/$1an/
    - xform/(\w)k/$1ao/
    - xform/(\w)l/$1ai/
    - xform/(\w)z/$1iao/
    - xform/(\w)x/$1ie/
    - xform/([gkhaev])c/$1uai/
    - xform/(\w)c/$1in/
    - xform/(\w)b/$1ou/
    - xform/([nl])m/$1ve/
    - xform/([jqxy])m/$1ue/
    - xform/(\w)m/$1ui/
    - "xform/(^|[ '])a/$1zh/"
    - "xform/(^|[ '])e/$1ch/"
    - "xform/(^|[ '])v/$1sh/"
    - xform/0(\w)/$1/
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
    - xform/ü/v/
    - xform/(?<=[A-Z])\s(?=[A-Z])//

melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0.8
  comment_format:
    - xform/.*//

cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en_abc
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.6
  comment_format:
    - xform/^.+$//

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - xform/^zh/Ⓐ/
    - xform/^ch/Ⓔ/
    - xform/^sh/Ⓥ/
    - xform/^([aoe].*)$/Ⓞ$1/
    - xform/ei$/Ⓠ/
    - xform/ian$/Ⓦ/
    - xform/er$|iu$/Ⓡ/
    - xform/[iu]ang$/Ⓣ/
    - xform/ing$/Ⓨ/
    - xform/uo$/Ⓞ/
    - xform/uan$/Ⓟ/
    - xform/(.)i?ong$/$1Ⓢ/
    - xform/[iu]a$/Ⓓ/
    - xform/en$/Ⓕ/
    - xform/eng$/Ⓖ/
    - xform/ang$/Ⓗ/
    - xform/an$/Ⓙ/
    - xform/iao$/Ⓩ/
    - xform/ao$/Ⓚ/
    - xform/in$|uai$/Ⓒ/
    - xform/ai$/Ⓛ/
    - xform/ie$/Ⓧ/
    - xform/ou$/Ⓑ/
    - xform/un$/Ⓝ/
    - xform/[uv]e$|ui$/Ⓜ/
    - xlit/ⓆⓌⒺⓇⓉⓎⓄⓅⒶⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwertyopasdfghjklzxcvbnm/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
