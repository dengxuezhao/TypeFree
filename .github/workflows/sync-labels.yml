name: Sync Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.json"
      - ".github/workflows/sync-labels.yml"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-labels:
    name: Sync Labels from .github/labels.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create or update labels
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const desired = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existingList = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existingMap = new Map(existingList.map(l => [l.name.toLowerCase(), l]));

            for (const label of desired) {
              const current = existingMap.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Created label: ${label.name}`);
              } else if (
                current.name !== label.name ||
                current.color.toLowerCase() !== label.color.toLowerCase() ||
                (current.description || '') !== (label.description || '')
              ) {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: current.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Updated label: ${label.name}`);
              }
            }
