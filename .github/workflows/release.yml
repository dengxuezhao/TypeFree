name: Release TypeFree Standard APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v3.6.1)"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: QA Gate, Build Standard Release APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata & signing mode
        id: meta
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          KS_B64: ${{ secrets.TYPEFREE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.TYPEFREE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TYPEFREE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TYPEFREE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected semantic tag like v3.6.1 or v3.6.1-beta.1."
            exit 1
          fi

          APP_VERSION=$(grep -E '^TYPEFREE_VERSION_NAME=' gradle.properties 2>/dev/null | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          IS_SIGNED="false"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            IS_SIGNED="true"
          fi

          {
            echo "tag=$TAG"
            echo "app_version=$APP_VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "is_signed=$IS_SIGNED"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release Metadata"
            echo "- Tag: \`$TAG\`"
            echo "- \`app/build.gradle.kts\` versionName: \`$APP_VERSION\`"
            echo "- Prerelease: \`$IS_PRERELEASE\`"
            echo "- Formal release keystore configured: \`$IS_SIGNED\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TAG" != "v${APP_VERSION}" ]; then
            echo "::warning::Tag '$TAG' does not exactly match app/build.gradle.kts versionName '${APP_VERSION}'."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses for NDK & CMake
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache upstream librime 1.17.0 C++ dependencies
        uses: actions/cache@v4
        with:
          path: |
            rime/src/main/cpp/librime
            rime/src/main/cpp/boost
            rime/src/main/cpp/snappy
            rime/src/main/cpp/librime-lua
            rime/src/main/cpp/librime-lua-deps
            rime/src/main/cpp/librime-octagram
            rime/src/main/cpp/librime-predict
          key: librime-1.17.0-deps-${{ hashFiles('rime/src/main/cpp/fetch_librime_deps.sh') }}

      - name: Fetch upstream librime 1.17.0 dependencies
        run: bash rime/src/main/cpp/fetch_librime_deps.sh

      - name: Run QA unit tests before release
        run: |
          TASKS=""
          if grep -q 'include(":core")' settings.gradle.kts; then
            TASKS=":core:test"
          fi
          if grep -q 'create("standard")' app/build.gradle.kts; then
            TASKS="$TASKS testStandardDebugUnitTest"
          else
            TASKS="$TASKS testDebugUnitTest"
          fi
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Decode release keystore (if configured)
        if: steps.meta.outputs.is_signed == 'true'
        env:
          KS_B64: ${{ secrets.TYPEFREE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > /tmp/typefree-release.jks
          test -s /tmp/typefree-release.jks

      - name: Assemble Standard Release APK
        id: build
        env:
          TYPEFREE_KEYSTORE_PATH: ${{ steps.meta.outputs.is_signed == 'true' && '/tmp/typefree-release.jks' || '' }}
          TYPEFREE_KEYSTORE_PASSWORD: ${{ secrets.TYPEFREE_KEYSTORE_PASSWORD }}
          TYPEFREE_KEY_ALIAS: ${{ secrets.TYPEFREE_KEY_ALIAS }}
          TYPEFREE_KEY_PASSWORD: ${{ secrets.TYPEFREE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if grep -q 'create("standard")' app/build.gradle.kts; then
            ./gradlew assembleStandardRelease --no-daemon --stacktrace
            APK_PATH=$(find app/build/outputs/apk/standard/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          test -f "$APK_PATH"

          TAG="${{ steps.meta.outputs.tag }}"
          if [ "${{ steps.meta.outputs.is_signed }}" = "true" ]; then
            OUT_NAME="TypeFree-${TAG}-standard-release.apk"
          else
            OUT_NAME="TypeFree-${TAG}-standard-release-debugsigned.apk"
          fi

          cp "$APK_PATH" "$OUT_NAME"
          sha256sum "$OUT_NAME" | tee "${OUT_NAME}.sha256"

          echo "apk_file=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_file=${OUT_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/typefree-release.jks

      - name: Create or update GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          IS_SIGNED: ${{ steps.meta.outputs.is_signed }}
          APK_FILE: ${{ steps.build.outputs.apk_file }}
          SHA_FILE: ${{ steps.build.outputs.sha_file }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          SIGN_NOTE="本安装包使用正式发布密钥签名，支持直接覆盖升级。"
          if [ "$IS_SIGNED" != "true" ]; then
            SIGN_NOTE="⚠️ 仓库尚未配置正式签名 Secrets，本包回退为 Debug 签名（若与之前签名不同需卸载重装）。"
          fi

          NOTES_FILE="/tmp/release_notes_header.md"
          cat > "$NOTES_FILE" << EOF
          ### 安装包说明
          - **公开标准版**：\`${APK_FILE}\`（校验文件：\`${SHA_FILE}\`）
          - **签名状态**：${SIGN_NOTE}
          - **小鹤音形专享版用户注意**：公开 Release 仅内置开源词表，直接覆盖安装会替换内置私有小鹤词库，请通过小鹤专享渠道更新。

          ---
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_SIGNED" = "true" ]; then
              gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
            else
              echo "Release $TAG already exists and repository keystore secrets are not configured; skipping unsigned debugsigned APK upload to preserve existing release signing."
            fi
          else
            EXTRA_FLAGS=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            if [ -n "$PREV_TAG" ]; then
              EXTRA_FLAGS+=(--notes-start-tag "$PREV_TAG")
            fi
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --verify-tag \
              --title "TypeFree ${TAG}" \
              --generate-notes \
              --notes "$(cat "$NOTES_FILE")" \
              "${EXTRA_FLAGS[@]}"
          fi

          RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts backup
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-${{ steps.meta.outputs.tag }}-standard-release
          path: |
            ${{ steps.build.outputs.apk_file }}
            ${{ steps.build.outputs.sha_file }}
            app/build/reports/tests/
          retention-days: 30

      - name: Notify issues closed in this release
        id: notify_issues
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PREV_TAG: ${{ steps.publish.outputs.prev_tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const releaseTag = process.env.RELEASE_TAG;
            const prevTag = process.env.PREV_TAG;
            const releaseUrl = process.env.RELEASE_URL;
            const range = prevTag ? `${prevTag}..${releaseTag}` : releaseTag;

            let logOutput = '';
            try {
              logOutput = execFileSync('git', ['log', range, '--format=%s%n%b'], { encoding: 'utf8' });
            } catch (err) {
              core.warning(`Failed to inspect git log for ${range}: ${err.message}`);
              return;
            }

            const issueNumbers = new Set();
            const prNumbers = new Set();

            const closeRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            for (const match of logOutput.matchAll(closeRegex)) {
              issueNumbers.add(Number(match[1]));
            }

            const prRegex = /(?:Merge pull request #(\d+)|\(\s*#(\d+)\s*\))/g;
            for (const match of logOutput.matchAll(prRegex)) {
              const num = Number(match[1] || match[2]);
              if (num) prNumbers.add(num);
            }

            for (const prNumber of prNumbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                const prText = `${pr.title || ''}\n${pr.body || ''}`;
                for (const match of prText.matchAll(closeRegex)) {
                  issueNumbers.add(Number(match[1]));
                }
              } catch (err) {
                core.info(`Skipping PR #${prNumber}: ${err.message}`);
              }
            }

            const notified = [];
            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                if (issue.pull_request || issue.state !== 'closed' || issue.state_reason === 'not_planned') {
                  continue;
                }

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                });
                const alreadyNotified = comments.some(c => (c.body || '').includes(`**${releaseTag}**`));
                if (alreadyNotified) continue;

                const body = [
                  `🎉 本 Issue 关联的改动已随 **${releaseTag}** 发布！`,
                  '',
                  `- 下载与更新日志：[TypeFree ${releaseTag}](${releaseUrl})`,
                  '- 你也可以直接在应用内「设置 → 检查更新」获取新版提示。',
                  '',
                  '欢迎更新后验证体验；如仍有异常请随时补充反馈。'
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });
                notified.push(`#${issueNumber}`);
              } catch (err) {
                core.warning(`Failed to notify issue #${issueNumber}: ${err.message}`);
              }
            }

            core.info(`Notified closed issues: ${notified.join(', ') || 'none'}`);
            core.setOutput('notified_issues', notified.join(', '));

      - name: Notify Feishu bot on Release published (optional)
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          APK_FILE: ${{ steps.build.outputs.apk_file }}
          IS_SIGNED: ${{ steps.meta.outputs.is_signed }}
          NOTIFIED_ISSUES: ${{ steps.notify_issues.outputs.notified_issues }}
        run: |
          if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
            echo "FEISHU_WEBHOOK_URL secret is not configured; skipping Feishu notification."
            exit 0
          fi

          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          webhook = os.environ["FEISHU_WEBHOOK_URL"].strip()
          issues_str = os.environ.get("NOTIFIED_ISSUES") or "无自动关联 Issue"
          signed_str = "正式签名" if os.environ.get("IS_SIGNED") == "true" else "Debug 回退签名"

          payload = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "template": "green",
                      "title": {
                          "tag": "plain_text",
                          "content": f"TypeFree {os.environ['RELEASE_TAG']} 已发布"
                      }
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": (
                                  f"**安装包**：`{os.environ['APK_FILE']}`\n"
                                  f"**签名状态**：{signed_str}\n"
                                  f"**已自动通知 Issue**：{issues_str}"
                              )
                          }
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "查看 GitHub Release"},
                                  "type": "primary",
                                  "url": os.environ["RELEASE_URL"]
                              }
                          ]
                      }
                  ]
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Feishu webhook status: {resp.status}")
          except Exception as exc:
              print(f"::warning::Feishu webhook notification failed: {exc}")
          PYEOF
