name: Build TypeFree FOSS Libre APK (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish FOSS Libre APK (e.g. v3.9.0)"
        required: true
      skip_notify:
        description: "Skip Issue, Feishu, and QQ group notifications"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: QA Gate, Build Standard Release APK & Publish
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata & signing mode
        id: meta
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          INPUT_SKIP_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_notify || false }}
          KS_B64: ${{ secrets.TYPEFREE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.TYPEFREE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TYPEFREE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TYPEFREE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected semantic tag like v3.6.1 or v3.6.1-beta.1."
            exit 1
          fi

          APP_VERSION=$(grep -E '^TYPEFREE_VERSION_NAME=' gradle.properties 2>/dev/null | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          IS_PRERELEASE="false"
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          IS_SIGNED="false"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            IS_SIGNED="true"
          fi

          TAG_CONTENTS=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}" 2>/dev/null || true)
          SKIP_NOTIFY="false"
          if [ "${INPUT_SKIP_NOTIFY:-false}" = "true" ] || [[ "$TAG_CONTENTS" == *"[skip-notify]"* ]] || [[ "$TAG_CONTENTS" == *"[silent]"* ]]; then
            SKIP_NOTIFY="true"
          fi

          {
            echo "tag=$TAG"
            echo "app_version=$APP_VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "is_signed=$IS_SIGNED"
            echo "skip_notify=$SKIP_NOTIFY"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release Metadata"
            echo "- Tag: \`$TAG\`"
            echo "- \`app/build.gradle.kts\` versionName: \`$APP_VERSION\`"
            echo "- Prerelease: \`$IS_PRERELEASE\`"
            echo "- Formal release keystore configured: \`$IS_SIGNED\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TAG" != "v${APP_VERSION}" ]; then
            echo "::warning::Tag '$TAG' does not exactly match app/build.gradle.kts versionName '${APP_VERSION}'."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses for NDK & CMake
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache upstream librime 1.17.0 C++ dependencies
        uses: actions/cache@v4
        with:
          path: |
            rime/src/main/cpp/librime
            rime/src/main/cpp/boost
            rime/src/main/cpp/snappy
            rime/src/main/cpp/librime-lua
            rime/src/main/cpp/librime-lua-deps
            rime/src/main/cpp/librime-octagram
            rime/src/main/cpp/librime-predict
          key: librime-1.17.0-deps-${{ hashFiles('rime/src/main/cpp/fetch_librime_deps.sh') }}

      - name: Fetch upstream librime 1.17.0 dependencies
        run: bash rime/src/main/cpp/fetch_librime_deps.sh

      - name: Cache offline AI dependencies (sherpa-onnx AAR & llama.cpp)
        uses: actions/cache@v4
        with:
          path: |
            app/libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar
            localai-native/src/main/cpp/llama.cpp
          key: offline-ai-deps-${{ hashFiles('scripts/fetch_offline_deps.sh') }}

      - name: Fetch offline AI dependencies (sherpa-onnx AAR & llama.cpp)
        run: bash scripts/fetch_offline_deps.sh

      - name: Run QA unit tests before release
        run: |
          TASKS=""
          if grep -q 'include(":core")' settings.gradle.kts; then
            TASKS=":core:test"
          fi
          if grep -q 'create("standard")' app/build.gradle.kts; then
            TASKS="$TASKS testStandardDebugUnitTest"
          else
            TASKS="$TASKS testDebugUnitTest"
          fi
          ./gradlew $TASKS \
            -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvmargs="-Xmx2560m" \
            --no-daemon --max-workers=2 --stacktrace

      - name: Decode release keystore (if configured)
        if: steps.meta.outputs.is_signed == 'true'
        env:
          KS_B64: ${{ secrets.TYPEFREE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | base64 -d > /tmp/typefree-release.jks
          test -s /tmp/typefree-release.jks

      - name: Assemble Standard Release APK
        id: build
        env:
          TYPEFREE_KEYSTORE_PATH: ${{ steps.meta.outputs.is_signed == 'true' && '/tmp/typefree-release.jks' || '' }}
          TYPEFREE_KEYSTORE_PASSWORD: ${{ secrets.TYPEFREE_KEYSTORE_PASSWORD }}
          TYPEFREE_KEY_ALIAS: ${{ secrets.TYPEFREE_KEY_ALIAS }}
          TYPEFREE_KEY_PASSWORD: ${{ secrets.TYPEFREE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          JVM_OPTS=(-Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx2560m")
          if grep -q 'create("standard")' app/build.gradle.kts; then
            ./gradlew assembleStandardRelease "${JVM_OPTS[@]}" --no-daemon --max-workers=2 --stacktrace
            APK_PATH=$(find app/build/outputs/apk/standard/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleRelease "${JVM_OPTS[@]}" --no-daemon --max-workers=2 --stacktrace
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          test -f "$APK_PATH"

          TAG="${{ steps.meta.outputs.tag }}"
          if [ "${{ steps.meta.outputs.is_signed }}" = "true" ]; then
            OUT_NAME="TypeFree-${TAG}-standard-release.apk"
          else
            OUT_NAME="TypeFree-${TAG}-standard-release-debugsigned.apk"
          fi

          cp "$APK_PATH" "$OUT_NAME"
          sha256sum "$OUT_NAME" | tee "${OUT_NAME}.sha256"

          echo "apk_file=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_file=${OUT_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f /tmp/typefree-release.jks

      - name: Create or update GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          IS_SIGNED: ${{ steps.meta.outputs.is_signed }}
          APK_FILE: ${{ steps.build.outputs.apk_file }}
          SHA_FILE: ${{ steps.build.outputs.sha_file }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          NOTES_FILE="/tmp/release_notes_full.md"
          python3 - "$TAG" "$PREV_TAG" "$IS_SIGNED" "$IS_PRERELEASE" "$APK_FILE" "$SHA_FILE" "$GITHUB_REPO" "$NOTES_FILE" << 'PYEOF'
          import os
          import re
          import subprocess
          import sys

          tag, prev_tag, is_signed, is_prerelease, apk_file, sha_file, repo, out_path = sys.argv[1:9]

          def run_git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True, stderr=subprocess.DEVNULL).strip()

          def load_highlights() -> str:
              # Priority 1: Dedicated curated release notes file docs/releases/<tag>.md
              notes_doc = os.path.join("docs", "releases", f"{tag}.md")
              if os.path.isfile(notes_doc):
                  text = open(notes_doc, encoding="utf-8").read().strip()
                  if text:
                      return text if text.lstrip().startswith("#") else f"### 更新亮点\n\n{text}"

              # Priority 2: Annotated tag message body (beyond first subject line)
              try:
                  tag_body = run_git("for-each-ref", "--format=%(contents:body)", f"refs/tags/{tag}")
                  if tag_body:
                      return tag_body if tag_body.lstrip().startswith("#") else f"### 更新亮点\n\n{tag_body}"
              except Exception:
                  pass

              # Priority 3: Auto-extract structured bullets from git log since previous tag
              rev_range = f"{prev_tag}..{tag}" if prev_tag else tag
              try:
                  raw_log = run_git("log", rev_range, "--no-merges", "--format=%s%x1f%b%x1e")
              except Exception:
                  raw_log = ""

              bullets: list[str] = []
              seen: set[str] = set()
              skip_re = re.compile(r"^(?:bump\s+version|release\s+v?\d|chore\(release\)|merge\s+)", re.IGNORECASE)

              for record in raw_log.split("\x1e"):
                  record = record.strip()
                  if not record:
                      continue
                  parts = record.split("\x1f", 1)
                  subject = parts[0].strip()
                  body = parts[1].strip() if len(parts) > 1 else ""

                  body_bullets: list[str] = []
                  for line in body.splitlines():
                      s = line.strip()
                      if re.match(r"^[-*•]\s+", s):
                          item = re.sub(r"^[-*•]\s+", "", s).strip()
                          if item and not skip_re.match(item):
                              body_bullets.append(item)

                  candidates = body_bullets if body_bullets else ([subject] if subject and not skip_re.match(subject) else [])
                  for item in candidates:
                      key = item.lower()
                      if key not in seen:
                          seen.add(key)
                          bullets.append(f"- {item}")

              if not bullets:
                  bullets.append(f"- 发布 TypeFree {tag} 正式版本，包含最新功能与稳定性优化。")
              return "### 更新亮点\n\n" + "\n".join(bullets[:20])

          highlights = load_highlights()

          if is_signed == "true":
              sign_note = (
                  "本安装包使用正式发布密钥签名，支持后续版本直接覆盖升级。"
                  "（注：若从 v3.8.3 或更早的 Debug 签名旧版升级提示“签名不一致”，请先在应用内「通用 → 导出备份」保存配置，卸载旧版后安装一次即可。）"
              )
          else:
              sign_note = "⚠️ 仓库尚未配置正式签名 Secrets，本包回退为 Debug 签名（若与之前签名不同需卸载重装）。"

          install_lines = [
              "### 安装包说明",
              "",
              f"- **公开版安装包**：`{apk_file}`（校验文件：`{sha_file}`）",
          ]
          if is_prerelease != "true" and re.match(r"^v\d+\.\d+\.\d+$", tag):
              install_lines.append(
                  f"- **官网直链下载（国内推荐）**：https://typefree.xuezhao.space/downloads/TypeFree-{tag}-release.apk （官网首页：https://typefree.xuezhao.space ）"
              )
          install_lines.extend([
              f"- **签名状态**：{sign_note}",
              "- **内置词库与第三方方案**：内置开源雾凇全拼、九键拼音、小鹤双拼及一键预设星空键道 6 / 五笔 86 / 虎码；如需小鹤音形等第三方方案，请在应用内「键盘 → 词库管理」直接导入官方 Rime 挂接包（`.zip`）。",
          ])

          sections = [highlights, "---", "\n".join(install_lines)]
          if prev_tag:
              sections.append(f"**Full Changelog**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          with open(out_path, "w", encoding="utf-8") as fh:
              fh.write("\n\n".join(sections) + "\n")
          PYEOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$IS_SIGNED" = "true" ]; then
              gh release upload "$TAG" "$APK_FILE" "$SHA_FILE" --clobber
            else
              echo "Release $TAG already exists and repository keystore secrets are not configured; skipping unsigned debugsigned APK upload to preserve existing release signing."
            fi
          else
            EXTRA_FLAGS=()
            if [ "$IS_PRERELEASE" = "true" ]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "$APK_FILE" "$SHA_FILE" \
              --verify-tag \
              --title "TypeFree ${TAG}" \
              --notes-file "$NOTES_FILE" \
              "${EXTRA_FLAGS[@]}"
          fi

          RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
          APK_URL=$(gh release view "$TAG" --json assets -q ".assets[] | select(.name == \"$APK_FILE\") | .url" | head -n 1 || true)
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts backup
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-${{ steps.meta.outputs.tag }}-standard-release
          path: |
            ${{ steps.build.outputs.apk_file }}
            ${{ steps.build.outputs.sha_file }}
            app/build/reports/tests/
          retention-days: 30

      - name: Notify issues closed in this release
        id: notify_issues
        if: steps.meta.outputs.skip_notify != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PREV_TAG: ${{ steps.publish.outputs.prev_tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const releaseTag = process.env.RELEASE_TAG;
            const prevTag = process.env.PREV_TAG;
            const releaseUrl = process.env.RELEASE_URL;
            const range = prevTag ? `${prevTag}..${releaseTag}` : releaseTag;

            let logOutput = '';
            try {
              logOutput = execFileSync('git', ['log', range, '--format=%s%n%b'], { encoding: 'utf8' });
            } catch (err) {
              core.warning(`Failed to inspect git log for ${range}: ${err.message}`);
              return;
            }

            const issueNumbers = new Set();
            const prNumbers = new Set();

            const closeRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            for (const match of logOutput.matchAll(closeRegex)) {
              issueNumbers.add(Number(match[1]));
            }

            const prRegex = /(?:Merge pull request #(\d+)|\(\s*#(\d+)\s*\))/g;
            for (const match of logOutput.matchAll(prRegex)) {
              const num = Number(match[1] || match[2]);
              if (num) prNumbers.add(num);
            }

            for (const prNumber of prNumbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                const prText = `${pr.title || ''}\n${pr.body || ''}`;
                for (const match of prText.matchAll(closeRegex)) {
                  issueNumbers.add(Number(match[1]));
                }
              } catch (err) {
                core.info(`Skipping PR #${prNumber}: ${err.message}`);
              }
            }

            const notified = [];
            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                if (issue.pull_request || issue.state !== 'closed' || issue.state_reason === 'not_planned') {
                  continue;
                }

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                });
                const alreadyNotified = comments.some(c => (c.body || '').includes(`**${releaseTag}**`));
                if (alreadyNotified) continue;

                const body = [
                  `🎉 本 Issue 关联的改动已随 **${releaseTag}** 发布！`,
                  '',
                  `- 下载与更新日志：[TypeFree ${releaseTag}](${releaseUrl})`,
                  '- 你也可以直接在应用内「设置 → 检查更新」获取新版提示。',
                  '',
                  '欢迎更新后验证体验；如仍有异常请随时补充反馈。'
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });
                notified.push(`#${issueNumber}`);
              } catch (err) {
                core.warning(`Failed to notify issue #${issueNumber}: ${err.message}`);
              }
            }

            core.info(`Notified closed issues: ${notified.join(', ') || 'none'}`);
            core.setOutput('notified_issues', notified.join(', '));

      - name: Notify Feishu bot on Release published (optional)
        if: steps.meta.outputs.skip_notify != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          APK_FILE: ${{ steps.build.outputs.apk_file }}
          IS_SIGNED: ${{ steps.meta.outputs.is_signed }}
          NOTIFIED_ISSUES: ${{ steps.notify_issues.outputs.notified_issues }}
        run: |
          if [ -z "${FEISHU_WEBHOOK_URL:-}" ]; then
            echo "FEISHU_WEBHOOK_URL secret is not configured; skipping Feishu notification."
            exit 0
          fi

          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          webhook = os.environ["FEISHU_WEBHOOK_URL"].strip()
          issues_str = os.environ.get("NOTIFIED_ISSUES") or "无自动关联 Issue"
          signed_str = "正式签名" if os.environ.get("IS_SIGNED") == "true" else "Debug 回退签名"

          payload = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "template": "green",
                      "title": {
                          "tag": "plain_text",
                          "content": f"TypeFree {os.environ['RELEASE_TAG']} 已发布"
                      }
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": (
                                  f"**安装包**：`{os.environ['APK_FILE']}`\n"
                                  f"**签名状态**：{signed_str}\n"
                                  f"**已自动通知 Issue**：{issues_str}"
                              )
                          }
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "查看 GitHub Release"},
                                  "type": "primary",
                                  "url": os.environ["RELEASE_URL"]
                              }
                          ]
                      }
                  ]
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"Feishu webhook status: {resp.status}")
          except Exception as exc:
              print(f"::warning::Feishu webhook notification failed: {exc}")
          PYEOF

      - name: Notify QQ feedback group via Bridge (optional)
        if: steps.meta.outputs.skip_notify != 'true'
        env:
          QQ_BRIDGE_URL: ${{ secrets.QQ_BRIDGE_URL }}
          QQ_BRIDGE_SECRET: ${{ secrets.QQ_BRIDGE_SECRET }}
          QQ_FEEDBACK_GROUP_ID: ${{ secrets.QQ_FEEDBACK_GROUP_ID }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          APK_URL: ${{ steps.publish.outputs.apk_url }}
          APK_FILE: ${{ steps.build.outputs.apk_file }}
          IS_SIGNED: ${{ steps.meta.outputs.is_signed }}
          NOTIFIED_ISSUES: ${{ steps.notify_issues.outputs.notified_issues }}
        run: |
          if [ -z "${QQ_BRIDGE_URL:-}" ] || [ -z "${QQ_BRIDGE_SECRET:-}" ]; then
            echo "QQ_BRIDGE_URL / QQ_BRIDGE_SECRET not configured; skipping QQ group notification."
            exit 0
          fi

          python3 - << 'PYEOF'
          import json
          import os
          import re
          import urllib.request

          url = os.environ["QQ_BRIDGE_URL"].strip()
          secret = os.environ["QQ_BRIDGE_SECRET"].strip()
          group_id = os.environ.get("QQ_FEEDBACK_GROUP_ID", "").strip()
          tag = os.environ["RELEASE_TAG"].strip()
          is_prerelease = os.environ.get("IS_PRERELEASE", "false").lower() == "true"
          official_site_url = "https://typefree.xuezhao.space"
          official_apk_url = (
              f"{official_site_url}/downloads/TypeFree-{tag}-release.apk"
              if (not is_prerelease and re.match(r"^v\d+\.\d+\.\d+$", tag))
              else ""
          )
          release_notes = ""
          if os.path.isfile("/tmp/release_notes_full.md"):
              release_notes = open("/tmp/release_notes_full.md", encoding="utf-8").read()

          payload = {
              "event": "release",
              "tag": tag,
              "release_url": os.environ["RELEASE_URL"],
              "apk_url": os.environ.get("APK_URL", ""),
              "official_site_url": official_site_url,
              "official_apk_url": official_apk_url,
              "apk_file": os.environ["APK_FILE"],
              "is_signed": os.environ.get("IS_SIGNED", "false"),
              "notified_issues": os.environ.get("NOTIFIED_ISSUES", ""),
              "release_notes": release_notes,
          }
          if group_id.isdigit():
              payload["group_id"] = int(group_id)

          req = urllib.request.Request(
              url,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "Authorization": f"Bearer {secret}",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"QQ bridge release notify status: {resp.status}")
          except Exception as exc:
              print(f"::warning::QQ bridge release notification failed: {exc}")
          PYEOF
